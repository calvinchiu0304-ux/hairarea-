  <script>
    const SUPABASE_URL = 'https://dzfyweiypnhodcffussz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Znl3ZWl5cG5ob2RjZmZ1c3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU0ODAsImV4cCI6MjEwODg0MTQ4MH0.4IGm5K2N9RDr_RAO6STivC9E6_HxlLyMg6tCzTS6zEg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map, markersGroup, baseTileLayer;
    let isDarkTheme = true;
    let rawStylistsData = [];
    let currentFilteredData = [];
    let activeTag = null;
    let isListView = false;
    let miniMap = null, miniMarker = null;
    let targetEditingId = null;

    window.onload = async function() {
      map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 13);
      baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      applyMapFilter(true);
      markersGroup = L.layerGroup().addTo(map);
      await fetchStylists();
    };

    async function fetchStylists() {
      try {
        const { data, error } = await supabaseClient
          .from('stylists')
          .select('*')
          .eq('status', 'approved');

        if (!error && data) {
          rawStylistsData = data;
        } else {
          rawStylistsData = [];
        }
      } catch (err) {
        rawStylistsData = [];
      }
      currentFilteredData = [...rawStylistsData];
      renderMarkers(currentFilteredData);
      renderListView(currentFilteredData);
    }

    function getWhatsAppLink(phone, name) {
      const cleanPhone = String(phone).replace(/\D/g, '');
      return `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(`你好！我在【香港髮型地圖】看到 ${name} 的專頁，想查詢與預約剪髮/電染服務...`)}`;
    }

    function applyMapFilter(dark) {
      const tileContainer = baseTileLayer.getContainer();
      if (tileContainer) {
        if (dark) tileContainer.classList.add('dark-map-tile');
        else tileContainer.classList.remove('dark-map-tile');
      }
    }

    function toggleMapTheme() {
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');
      if (isDarkTheme) {
        applyMapFilter(false);
        themeIcon.className = "fa-solid fa-moon"; themeText.innerText = "深色"; isDarkTheme = false;
      } else {
        applyMapFilter(true);
        themeIcon.className = "fa-solid fa-sun"; themeText.innerText = "淺色"; isDarkTheme = true;
      }
    }

    function zoomInMap() { if (map) map.zoomIn(); }
    function zoomOutMap() { if (map) map.zoomOut(); }

    function renderMarkers(dataList) {
      markersGroup.clearLayers();
      dataList.forEach(stylist => {
        const bgColor = stylist.gender === 'F' ? '#EBBFCB' : '#89C4E6';
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${bgColor};" class="text-zinc-950 font-bold text-xs px-2.5 py-1 rounded-full shadow-md border border-white/80 flex items-center gap-1 hover:scale-110 transition cursor-pointer"><span>✂️ ${stylist.name}</span></div>`,
          iconSize: [95, 30], iconAnchor: [47, 15]
        });

        const waLink = getWhatsAppLink(stylist.whatsapp, stylist.name);
        const tagsArr = Array.isArray(stylist.tags) ? stylist.tags : [];
        const startingPrice = stylist.price_starting || 250;
        const igName = stylist.ig_handle || 'stylist';

        const popupContent = `
          <div class="w-64 p-1 text-zinc-900 bg-white">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-12 h-12 rounded-full border border-teal-500 bg-zinc-100 flex items-center justify-center font-bold text-teal-800 text-lg">${stylist.name.charAt(0)}</div>
              <div>
                <h4 class="font-bold text-base text-zinc-900 leading-tight">${stylist.name}</h4>
                <p class="text-xs text-teal-700 font-medium"><i class="fa-solid fa-store"></i> ${stylist.shop_name}</p>
              </div>
            </div>
            
            <div class="flex flex-wrap gap-1 mb-3">
              ${tagsArr.map(t => `<span class="bg-zinc-100 text-zinc-700 text-[10px] px-2 py-0.5 rounded border border-zinc-200 font-medium">#${t}</span>`).join('')}
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-zinc-100">
              <div>
                <span class="text-[10px] text-zinc-400 block">門檻起步價</span>
                <span class="text-sm font-extrabold text-teal-600">HK$ ${startingPrice}</span>
              </div>
              <div class="flex gap-1">
                ${stylist.ig_handle ? `<a href="https://instagram.com/${igName}" target="_blank" rel="noopener noreferrer" class="bg-[#EFEFEF] hover:bg-[#DBDBDB] text-zinc-800 text-xs px-2 py-1.5 rounded-lg border border-zinc-300 font-medium flex items-center gap-0.5"><i class="fa-brands fa-instagram text-pink-500"></i> IG</a>` : ''}
                <a href="${waLink}" target="_blank" rel="noopener noreferrer" class="bg-[#EFEFEF] hover:bg-[#DBDBDB] text-zinc-800 text-xs px-2 py-1.5 rounded-lg border border-zinc-300 font-bold flex items-center gap-0.5"><i class="fa-brands fa-whatsapp text-emerald-600"></i> 預約</a>
                <button onclick="openEditModal(${stylist.id})" class="bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-xs px-2 py-1.5 rounded-lg font-bold border border-zinc-300" title="修改資料"><i class="fa-solid fa-pen"></i></button>
              </div>
            </div>
          </div>
        `;
        L.marker([stylist.lat, stylist.lng], { icon: customIcon }).addTo(markersGroup).bindPopup(popupContent);
      });
    }

    function renderListView(dataList) {
      const container = document.getElementById('stylistListContainer');
      if (dataList.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-zinc-500"><i class="fa-solid fa-scissors text-3xl mb-2 block"></i><p class="text-sm">暫無符合條件的髮型師</p></div>`;
        return;
      }
      container.innerHTML = dataList.map(stylist => {
        const waLink = getWhatsAppLink(stylist.whatsapp, stylist.name);
        const genderBadgeColor = stylist.gender === 'F' ? 'bg-[#EBBFCB] text-zinc-950' : 'bg-[#89C4E6] text-zinc-950';
        const genderLabel = stylist.gender === 'F' ? '女髮型師' : '男髮型師';
        const tagsArr = Array.isArray(stylist.tags) ? stylist.tags : [];
        const startingPrice = stylist.price_starting || 250;
        const igName = stylist.ig_handle || 'stylist';

        return `
          <div class="bg-white border border-zinc-200 rounded-2xl p-4 shadow-lg text-zinc-900 transition">
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full border border-teal-500 bg-zinc-100 flex items-center justify-center font-bold text-teal-800 text-lg shrink-0">${stylist.name.charAt(0)}</div>
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="font-bold text-base text-zinc-900">${stylist.name}</h3>
                    <span class="text-[10px] ${genderBadgeColor} font-bold px-1.5 py-0.5 rounded">${genderLabel}</span>
                  </div>
                  <span class="text-xs bg-teal-50 text-teal-700 px-2 py-0.5 rounded border border-teal-200 font-medium">${stylist.district}</span>
                  <span class="text-xs text-zinc-600 ml-1 font-medium">${stylist.shop_name}</span>
                </div>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-zinc-400 block">門檻起步價</span>
                <span class="text-base font-extrabold text-teal-600">HK$ ${startingPrice}</span>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 mb-4">
              ${tagsArr.map(t => `<span class="bg-zinc-100 text-zinc-700 text-xs px-2.5 py-1 rounded-full border border-zinc-200 font-medium">#${t}</span>`).join('')}
            </div>

            <div class="flex items-center gap-2 pt-3 border-t border-zinc-100">
              <a href="https://instagram.com/${igName}" target="_blank" rel="noopener noreferrer" class="flex-1 bg-[#EFEFEF] hover:bg-[#DBDBDB] text-zinc-800 text-xs py-2 rounded-xl text-center font-bold border border-zinc-300/80 transition">
                <i class="fa-brands fa-instagram text-pink-500"></i> IG 作品
              </a>
              <a href="${waLink}" target="_blank" rel="noopener noreferrer" class="flex-1 bg-[#EFEFEF] hover:bg-[#DBDBDB] text-zinc-800 text-xs py-2 rounded-xl text-center font-bold border border-zinc-300/80 transition flex items-center justify-center gap-1">
                <i class="fa-brands fa-whatsapp text-emerald-600"></i> WhatsApp 預約
              </a>
              <button onclick="openEditModal(${stylist.id})" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs px-3 py-2 rounded-xl font-bold border border-zinc-300" title="修改資料">
                <i class="fa-solid fa-pen"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openEditModal(stylistId) {
      targetEditingId = stylistId;
      document.getElementById('verifyPinInput').value = '';
      document.getElementById('editAuthStep').classList.remove('hidden');
      document.getElementById('editForm').classList.add('hidden');
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function verifyAndLoadEditData() {
      const pin = document.getElementById('verifyPinInput').value.trim();
      if (!pin) {
        alert('請輸入編輯密碼！');
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('stylists')
          .select('*')
          .eq('id', targetEditingId)
          .single();

        if (error || !data) {
          alert('找不到此髮型師資料');
          return;
        }

        if (data.edit_pin && data.edit_pin !== pin) {
          alert('❌ 密碼錯誤！無法解鎖修改權限。');
          return;
        }

        document.getElementById('editStylistId').value = data.id;
        document.getElementById('editName').value = data.name || '';
        document.getElementById('editShop').value = data.shop_name || '';
        document.getElementById('editPrice').value = data.price_starting || '';
        document.getElementById('editIg').value = data.ig_handle || '';
        document.getElementById('editWa').value = data.whatsapp || '';

        document.getElementById('editAuthStep').classList.add('hidden');
        document.getElementById('editForm').classList.remove('hidden');

      } catch (err) {
        alert('驗證過程發生錯誤');
      }
    }

    async function submitEditUpdate(e) {
      e.preventDefault();
      const id = document.getElementById('editStylistId').value;
      const payload = {
        name: document.getElementById('editName').value.trim(),
        shop_name: document.getElementById('editShop').value.trim(),
        price_starting: parseFloat(document.getElementById('editPrice').value),
        ig_handle: document.getElementById('editIg').value.trim(),
        whatsapp: document.getElementById('editWa').value.trim()
      };

      try {
        const { error } = await supabaseClient
          .from('stylists')
          .update(payload)
          .eq('id', id);

        if (error) {
          alert('更新失敗: ' + error.message);
        } else {
          alert('🎉 個人資料已成功更新！');
          closeEditModal();
          await fetchStylists();
        }
      } catch (err) {
        alert('更新發生異常');
      }
    }

    function applyFilters() {
      const selectedDistrict = document.getElementById('districtFilter').value;
      currentFilteredData = rawStylistsData.filter(s => (selectedDistrict === 'ALL' || s.district === selectedDistrict) && (!activeTag || (s.tags || []).includes(activeTag)));
      renderMarkers(currentFilteredData);
      renderListView(currentFilteredData);
    }
    function toggleTagFilter(tag) {
      activeTag = (activeTag === tag) ? null : tag;
      applyFilters();
    }
    function resetFilters() {
      document.getElementById('districtFilter').value = 'ALL';
      activeTag = null;
      applyFilters();
    }
    function toggleView() {
      isListView = !isListView;
      document.getElementById('listView').classList.toggle('hidden', !isListView);
      document.getElementById('toggleText').innerText = isListView ? "切換為地圖視角" : "切換為列表視角";
      document.getElementById('toggleIcon').className = isListView ? "fa-solid fa-map-location-dot" : "fa-solid fa-list-ul";
    }
    function showHelpModal() { document.getElementById('helpModal').classList.remove('hidden'); }
    function closeHelpModal() { document.getElementById('helpModal').classList.add('hidden'); }
    function toggleSelectTag(btn) { btn.classList.toggle('bg-teal-500/25'); btn.classList.toggle('border-teal-500'); btn.classList.toggle('text-teal-300'); btn.classList.toggle('selected'); }

    function showApplyModal() {
      document.getElementById('applyModal').classList.remove('hidden');
      setTimeout(() => {
        if (!miniMap) {
          miniMap = L.map('miniMap').setView([22.3175, 114.1694], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(miniMap);
          miniMarker = L.marker([22.3175, 114.1694], { draggable: true }).addTo(miniMap);
          miniMap.on('click', e => { miniMarker.setLatLng(e.latlng); updateCoords(e.latlng.lat, e.latlng.lng); });
          miniMarker.on('dragend', e => { const pos = miniMarker.getLatLng(); updateCoords(pos.lat, pos.lng); });
        } else { miniMap.invalidateSize(); }
      }, 200);
    }
    function closeApplyModal() { document.getElementById('applyModal').classList.add('hidden'); }
    function updateCoords(lat, lng) {
      document.getElementById('applyLat').value = lat.toFixed(4);
      document.getElementById('applyLng').value = lng.toFixed(4);
    }
    function getGpsLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          if (miniMap && miniMarker) { miniMap.setView([lat, lng], 16); miniMarker.setLatLng([lat, lng]); updateCoords(lat, lng); }
          alert('📍 已成功取得 GPS 位置！');
        }, () => alert('無法取得 GPS 位置'));
      }
    }

    async function submitApplication(e) {
      e.preventDefault();
      const tags = Array.from(document.querySelectorAll('.select-tag-btn.selected')).map(b => b.getAttribute('data-tag'));
      if (tags.length === 0) { alert('請至少勾選一個風格標籤！'); return; }

      const payload = {
        name: document.getElementById('applyName').value.trim(),
        gender: document.getElementById('applyGender').value,
        shop_name: document.getElementById('applyShop').value.trim(),
        district: document.getElementById('applyDistrict').value,
        price_starting: parseFloat(document.getElementById('applyPrice').value) || 250,
        tags: tags,
        ig_handle: document.getElementById('applyIg').value.trim(),
        whatsapp: document.getElementById('applyWa').value.trim(),
        edit_pin: document.getElementById('applyPin').value.trim(),
        lat: parseFloat(document.getElementById('applyLat').value),
        lng: parseFloat(document.getElementById('applyLng').value),
        status: 'pending'
      };

      try {
        const { error } = await supabaseClient.from('stylists').insert([payload]);
        if (error) { alert('提交失敗: ' + error.message); } 
        else {
          alert('🎉 申請提交成功！管理員審核通過後將會顯示在地圖上。');
          document.getElementById('applyForm').reset();
          closeApplyModal();
        }
      } catch (err) { alert('提交發生異常'); }
    }
  </script>
</body>
</html>
