<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港髮型地圖 Hair Map HK | 認人不認店・極速搵髮型師</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' },
            accent: '#f43f5e'
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { touch-action: manipulation; }
    
    /* 舊檔經典的 OpenStreetMap 深色濾鏡，無需 API Key */
    .dark-map-tile {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    .leaflet-marker-pane,
    .leaflet-popup-pane {
      filter: none !important;
    }

    .leaflet-popup-content-wrapper { 
      background: #18181b; 
      color: #f4f4f5; 
      border: 1px solid #27272a; 
      border-radius: 1rem; 
      padding: 0; 
    }
    .leaflet-popup-tip { background: #18181b; }
    .leaflet-container { font-family: inherit; background-color: #09090b !important; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen flex flex-col overflow-hidden">

  <!-- 頂部導航欄 -->
  <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-teal-500/20 text-teal-400 rounded-xl flex items-center justify-center font-bold text-lg">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-wide text-white">香港髮型地圖</h1>
        <p class="text-[10px] text-zinc-400">動態雲端版</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button onclick="openApplyModal()" class="bg-teal-600 hover:bg-teal-500 text-zinc-950 font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-lg shadow-teal-900/20 flex items-center gap-1.5">
        <i class="fa-solid fa-user-plus"></i> 自薦加入
      </button>
      <a href="admin.html" class="text-zinc-400 hover:text-white text-xs px-2.5 py-2 bg-zinc-800/60 rounded-xl border border-zinc-700/50" title="管理員後台">
        <i class="fa-solid fa-shield-halved"></i>
      </a>
    </div>
  </header>

  <!-- 地圖主容器 -->
  <main id="map" class="flex-1 w-full z-10"></main>

  <!-- 髮型師自薦 Modal -->
  <div id="applyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl my-auto">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
        <h2 class="font-bold text-base text-teal-400"><i class="fa-solid fa-id-card-clip"></i> 髮型師雲端自薦</h2>
        <button onclick="closeApplyModal()" class="text-zinc-400 hover:text-white text-sm w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center">
          ✕
        </button>
      </div>

      <form id="applyForm" onsubmit="submitApplication(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">您的稱呼 / 藝名 *</label>
            <input type="text" id="stylistName" required placeholder="例如: Kenji" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">性別 *</label>
            <select id="stylistGender" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
              <option value="M">男髮型師</option>
              <option value="F">女髮型師</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">髮型屋名稱 *</label>
            <input type="text" id="shopName" required placeholder="例如: 678 Hair Salon" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">地區 *</label>
            <select id="district" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
              <option value="mongkok">旺角 / 油麻地</option>
              <option value="tst">尖沙咀</option>
              <option value="cwb">銅鑼灣</option>
              <option value="central">中環 / 上環</option>
              <option value="tkt">大角咀</option>
              <option value="other">其他地區</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">起步價 (HK$) *</label>
            <input type="number" id="priceStarting" required placeholder="例如: 380" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">WhatsApp 預約號碼 *</label>
            <input type="text" id="whatsapp" required placeholder="91234567" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1">Instagram 帳號 (選填)</label>
          <input type="text" id="igHandle" placeholder="例如: kenji_hair" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500">
        </div>

        <!-- 標籤選擇組件 -->
        <div>
          <label class="block text-xs text-zinc-400 mb-1">專業標籤 (可多選)</label>
          <div class="grid grid-cols-3 gap-2" id="tagCheckboxes">
            <label class="flex items-center gap-1.5 bg-zinc-800/80 p-2 rounded-xl text-xs cursor-pointer border border-zinc-700 hover:border-teal-500">
              <input type="checkbox" value="日系電髮" class="accent-teal-500"> 日系電髮
            </label>
            <label class="flex items-center gap-1.5 bg-zinc-800/80 p-2 rounded-xl text-xs cursor-pointer border border-zinc-700 hover:border-teal-500">
              <input type="checkbox" value="Barber漸變" class="accent-teal-500"> Barber漸變
            </label>
            <label class="flex items-center gap-1.5 bg-zinc-800/80 p-2 rounded-xl text-xs cursor-pointer border border-zinc-700 hover:border-teal-500">
              <input type="checkbox" value="單剪速剪" class="accent-teal-500"> 單剪速剪
            </label>
            <label class="flex items-center gap-1.5 bg-zinc-800/80 p-2 rounded-xl text-xs cursor-pointer border border-zinc-700 hover:border-teal-500">
              <input type="checkbox" value="韓系剪裁" class="accent-teal-500"> 韓系剪裁
            </label>
            <label class="flex items-center gap-1.5 bg-zinc-800/80 p-2 rounded-xl text-xs cursor-pointer border border-zinc-700 hover:border-teal-500">
              <input type="checkbox" value="歐美挑染" class="accent-teal-500"> 歐美挑染
            </label>
            <label class="flex items-center gap-1.5 bg-zinc-800/80 p-2 rounded-xl text-xs cursor-pointer border border-zinc-700 hover:border-teal-500">
              <input type="checkbox" value="男士專門" class="accent-teal-500"> 男士專門
            </label>
          </div>
        </div>

        <!-- 互動小地圖選點 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-zinc-400">店舖定位 (點擊地圖調整位置) *</label>
            <button type="button" onclick="getCurrentLocation()" class="text-[10px] text-teal-400 hover:underline"><i class="fa-solid fa-location-crosshairs"></i> 使用我的GPS</button>
          </div>
          <div id="miniMap" class="w-full h-36 rounded-xl border border-zinc-700 z-0"></div>
          <p class="text-[10px] text-zinc-500 mt-1">已選座標: <span id="coordText" class="text-teal-400">尚未選擇</span></p>
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-zinc-950 font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-teal-900/30">
          提交自薦審核
        </button>
      </form>
    </div>
  </div>

  <script>
    // Supabase 設定
    const SUPABASE_URL = 'https://dzfyweiypnhodcffussz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Znl3ZWl5cG5ob2RjZmZ1c3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU0ODAsImV4cCI6MjEwODg0MTQ4MH0.4IGm5K2N9RDr_RAO6STivC9E6_HxlLyMg6tCzTS6zEg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map, miniMap, baseTileLayer, marker, miniMarker;
    let selectedLat = 22.3193, selectedLng = 114.1694; // 預設香港中心

    // 初始化主地圖（使用穩定的 OpenStreetMap + 舊檔深色反相濾鏡）
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 13);
      
      baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      // 套用深色地圖濾鏡
      const tileContainer = baseTileLayer.getContainer();
      if (tileContainer) {
        tileContainer.classList.add('dark-map-tile');
      }

      L.control.zoom({ position: 'bottomright' }).addTo(map);
      loadApprovedStylists();
    }

    // 從 Supabase 載入已審核通過的髮型師
    async function loadApprovedStylists() {
      try {
        const { data, error } = await supabaseClient
          .from('stylists')
          .select('*')
          .eq('status', 'approved'); // 只抓取審核通過上線的資料[span_1](start_span)[span_1](end_span)

        if (error) {
          console.error('載入地圖資料失敗:', error.message);
          return;
        }

        if (data) {
          data.forEach(stylist => {
            if (stylist.lat && stylist.lng) {
              const popupContent = `
                <div class="p-3 text-xs space-y-1.5">
                  <div class="flex items-center gap-1.5 font-bold text-sm text-white">
                    <span>${stylist.name}</span>
                    <span class="text-[10px] bg-teal-500/20 text-teal-400 px-1.5 py-0.5 rounded">${stylist.gender === 'F' ? '女髮型師' : '男髮型師'}</span>
                  </div>
                  <p class="text-zinc-400"><i class="fa-solid fa-shop"></i> ${stylist.shop_name} (${stylist.district})</p>
                  <p class="text-teal-400 font-bold">起步價: HK$ ${stylist.price_starting}</p>
                  <p class="text-zinc-500">標籤: ${(stylist.tags || []).join(', ')}</p>
                  <div class="pt-2 flex gap-2">
                    <a href="https://wa.me/852${stylist.whatsapp}" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-2 rounded-lg text-center transition">
                      <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </a>
                    ${stylist.ig_handle ? `<a href="https://instagram.com/${stylist.ig_handle}" target="_blank" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-1.5 px-2 rounded-lg text-center transition"><i class="fa-brands fa-instagram"></i> IG</a>` : ''}
                  </div>
                </div>
              `;
              L.marker([stylist.lat, stylist.lng]).addTo(map).bindPopup(popupContent);
            }
          });
        }
      } catch (err) {
        console.error('發生錯誤:', err);
      }
    }

    // Modal 控制
    function openApplyModal() {
      document.getElementById('applyModal').classList.remove('hidden');
      setTimeout(() => {
        if (!miniMap) {
          miniMap = L.map('miniMap').setView([22.3193, 114.1694], 14);
          const miniTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(miniMap);
          
          const miniContainer = miniTile.getContainer();
          if (miniContainer) miniContainer.classList.add('dark-map-tile');

          miniMarker = L.marker([22.3193, 114.1694], { draggable: true }).addTo(miniMap);
          miniMarker.on('dragend', function(e) {
            const pos = miniMarker.getLatLng();
            selectedLat = pos.lat;
            selectedLng = pos.lng;
            updateCoordText();
          });

          miniMap.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;
            miniMarker.setLatLng([selectedLat, selectedLng]);
            updateCoordText();
          });
        } else {
          miniMap.invalidateSize();
        }
        updateCoordText();
      }, 200);
    }

    function closeApplyModal() {
      document.getElementById('applyModal').classList.add('hidden');
    }

    function updateCoordText() {
      document.getElementById('coordText').innerText = `${selectedLat.toFixed(4)}, ${selectedLng.toFixed(4)}`;
    }

    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          selectedLat = position.coords.latitude;
          selectedLng = position.coords.longitude;
          if (miniMap && miniMarker) {
            miniMap.setView([selectedLat, selectedLng], 16);
            miniMarker.setLatLng([selectedLat, selectedLng]);
          }
          updateCoordText();
        }, () => {
          alert('無法獲取您的GPS定位');
        });
      }
    }

    // 提交表單至 Supabase (單一資料表，狀態預設為 pending)
    async function submitApplication(e) {
      e.preventDefault();

      const tags = Array.from(document.querySelectorAll('#tagCheckboxes input:checked')).map(el => el.value);

      const payload = {
        name: document.getElementById('stylistName').value,
        gender: document.getElementById('stylistGender').value,
        shop_name: document.getElementById('shopName').value,
        district: document.getElementById('district').value,
        price_starting: parseFloat(document.getElementById('priceStarting').value),
        whatsapp: document.getElementById('whatsapp').value,
        ig_handle: document.getElementById('igHandle').value,
        tags: tags,
        lat: selectedLat,
        lng: selectedLng,
        status: 'pending' // 預設為待審核狀態
      };

      try {
        const { error } = await supabaseClient.from('stylists').insert([payload]);

        if (error) {
          alert('提交失敗: ' + error.message);
        } else {
          alert('🎉 申請提交成功！管理員審核通過後將會顯示在地圖上。');
          document.getElementById('applyForm').reset();
          closeApplyModal();
        }
      } catch (err) {
        alert('發生異常錯誤');
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
