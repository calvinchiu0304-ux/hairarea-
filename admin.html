<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理員後台 | 香港髮型地圖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans p-4">

  <!-- 登入保護區 -->
  <div id="loginSection" class="max-w-md mx-auto mt-24 bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-2xl">
    <h2 class="text-lg font-bold text-teal-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-lock"></i> 管理員登入</h2>
    <div class="space-y-3 text-xs">
      <input type="password" id="adminPwd" placeholder="請輸入管理員密碼" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100">
      <button onclick="checkAdminLogin()" class="w-full bg-teal-600 hover:bg-teal-500 text-zinc-950 font-bold py-2.5 rounded-xl transition">登入後台</button>
      <a href="index.html" class="block text-center text-zinc-400 hover:text-white mt-2">返回前台地圖</a>
    </div>
  </div>

  <!-- 後台主面板 (登入後顯示) -->
  <div id="adminPanel" class="hidden max-w-5xl mx-auto space-y-6 mt-6">
    <div class="flex items-center justify-between bg-zinc-900 border border-zinc-800 p-4 rounded-2xl shadow-lg">
      <h1 class="font-bold text-base text-teal-400 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> 香港髮型地圖 - 管理與私密資源後台</h1>
      <a href="index.html" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg border border-zinc-700">返回前台</a>
    </div>

    <!-- 頁籤切換 -->
    <div class="flex gap-2 border-b border-zinc-800 pb-2">
      <button onclick="switchAdminTab('stylists')" id="tabStylists" class="px-4 py-2 rounded-xl text-xs font-bold bg-teal-500 text-zinc-950 transition">✂️ 髮型師審核與管理</button>
      <button onclick="switchAdminTab('models')" id="tabModels" class="px-4 py-2 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:text-white transition">📸 私密模特兒資源庫</button>
    </div>

    <!-- 區塊 1：髮型師列表 -->
    <div id="sectionStylists" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl space-y-4">
      <h2 class="font-bold text-sm text-teal-400">所有已收錄與待審核髮型師 (含流量統計)</h2>
      <div id="adminStylistList" class="space-y-3 text-xs"></div>
    </div>

    <!-- 區塊 2：私密模特兒資源庫 -->
    <div id="sectionModels" class="hidden bg-zinc-900 border border-pink-500/40 rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="font-bold text-sm text-pink-400 flex items-center gap-2"><i class="fa-solid fa-camera-retro"></i> 素人模特兒私密資源庫</h2>
          <p class="text-[11px] text-zinc-400">此區資料全網私密，僅限管理員查看，可用於與髮型師對接拍片合作。</p>
        </div>
      </div>
      <div id="adminModelList" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs"></div>
    </div>
  </div>

  <!-- 🔍 圖片放大 Modal -->
  <div id="imageViewerModal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer" onclick="closeImageViewer()">
    <div class="relative max-w-3xl max-h-[90vh] flex flex-col items-center justify-center">
      <button onclick="closeImageViewer()" class="absolute -top-10 right-0 text-white text-2xl font-bold hover:text-pink-400"><i class="fa-solid fa-xmark"></i> 關閉</button>
      <img id="modalFullImage" src="" class="max-w-full max-h-[85vh] object-contain rounded-xl border border-zinc-700 shadow-2xl">
      <p class="text-zinc-400 text-xs mt-2">點擊任意處即可關閉放大視窗</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dzfyweiypnhodcffussz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Znl3ZWl5cG5ob2RjZmZ1c3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU0ODAsImV4cCI6MjEwODg0MTQ4MH0.4IGm5K2N9RDr_RAO6STivC9E6_HxlLyMg6tCzTS6zEg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function checkAdminLogin() {
      const pwd = document.getElementById('adminPwd').value.trim();
      if (pwd === 'admin888') {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadAdminData();
      } else {
        alert('❌ 管理員密碼錯誤！');
      }
    }

    function switchAdminTab(tab) {
      const sSec = document.getElementById('sectionStylists');
      const mSec = document.getElementById('sectionModels');
      const tS = document.getElementById('tabStylists');
      const tM = document.getElementById('tabModels');
      if (tab === 'stylists') {
        sSec.classList.remove('hidden'); mSec.classList.add('hidden');
        tS.className = "px-4 py-2 rounded-xl text-xs font-bold bg-teal-500 text-zinc-950 transition";
        tM.className = "px-4 py-2 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:text-white transition";
        loadAdminData();
      } else {
        sSec.classList.add('hidden'); mSec.classList.remove('hidden');
        tM.className = "px-4 py-2 rounded-xl text-xs font-bold bg-pink-500 text-zinc-950 transition";
        tS.className = "px-4 py-2 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-400 hover:text-white transition";
        loadModelsData();
      }
    }

    // ✂️ 髮型師審核與管理（包含 WA 與 IG 點擊數據顯示）
    async function loadAdminData() {
      const container = document.getElementById('adminStylistList');
      const { data, error } = await supabaseClient.from('stylists').select('*').order('id', { ascending: false });
      if (error || !data || data.length === 0) { container.innerHTML = `<p class="text-zinc-500">暫無髮型師資料</p>`; return; }
      
      container.innerHTML = data.map(s => {
        const isPending = s.status === 'pending' || !s.status;
        const waClicks = s.wa_clicks || 0;
        const igClicks = s.ig_clicks || 0;

        return `
          <div class="bg-zinc-950 border ${isPending ? 'border-amber-500/50' : 'border-zinc-800'} p-3.5 rounded-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-zinc-100 text-sm">${s.name}</span> 
                <span class="text-teal-400">(${s.district} · ${s.shop_name})</span>
                <span class="text-[10px] px-2 py-0.5 rounded font-bold ${isPending ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-teal-500/20 text-teal-400 border border-teal-500/30'}">
                  狀態: ${s.status || 'pending'}
                </span>
              </div>
              <p class="text-zinc-400 text-[11px] mt-1">
                價格: <span class="text-zinc-200">$${s.price_starting || 250}</span> | 
                WA: <span class="text-zinc-200">${s.whatsapp}</span> | 
                IG: <span class="text-zinc-200">${s.ig_handle || '無'}</span>
              </p>
              <!-- 📊 數據統計標籤 -->
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded font-semibold">
                  <i class="fa-brands fa-whatsapp"></i> WA 預約點擊: ${waClicks} 次
                </span>
                <span class="text-[10px] bg-pink-500/10 text-pink-400 border border-pink-500/30 px-2 py-0.5 rounded font-semibold">
                  <i class="fa-brands fa-instagram"></i> IG 瀏覽點擊: ${igClicks} 次
                </span>
              </div>
            </div>
            
            <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
              ${isPending ? `
                <button onclick="approveStylist(${s.id})" class="bg-teal-600 hover:bg-teal-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1 shadow-md">
                  <i class="fa-solid fa-check"></i> 審批通過
                </button>
              ` : `
                <button onclick="rejectStylist(${s.id})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 text-xs px-2.5 py-1.5 rounded-lg border border-zinc-700 transition">
                  設為待審
                </button>
              `}
              <button onclick="deleteStylist(${s.id})" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg font-bold transition">
                刪除
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 審批通過
    async function approveStylist(id) {
      const { error } = await supabaseClient.from('stylists').update({ status: 'approved' }).eq('id', id);
      if (error) {
        alert('❌ 審批失敗: ' + error.message);
      } else {
        alert('🎉 審批成功！該髮型師現已同步至地圖。');
        loadAdminData();
      }
    }

    // 改回待審
    async function rejectStylist(id) {
      const { error } = await supabaseClient.from('stylists').update({ status: 'pending' }).eq('id', id);
      if (error) {
        alert('❌ 操作失敗: ' + error.message);
      } else {
        alert('已將狀態改回待審。');
        loadAdminData();
      }
    }

    // 刪除髮型師
    async function deleteStylist(id) {
      if (confirm('確定要刪除這位髮型師嗎？')) {
        await supabaseClient.from('stylists').delete().eq('id', id);
        loadAdminData();
      }
    }

    // 📸 私密模特兒資源庫
    async function loadModelsData() {
      const container = document.getElementById('adminModelList');
      const { data } = await supabaseClient.from('hair_models').select('*').order('created_at', { ascending: false });
      if (!data || data.length === 0) { container.innerHTML = `<p class="text-zinc-500">目前私密庫中尚無模特兒登記</p>`; return; }
      container.innerHTML = data.map(m => {
        const cleanWa = String(m.whatsapp || '').replace(/\D/g, '');
        const waLink = `https://api.whatsapp.com/send?phone=${cleanWa}&text=${encodeURIComponent(`你好 ${m.model_name}！我在【香港髮型地圖】看到你登記的模特兒資料（${m.hair_status}），想邀請你參與拍攝...`)}`;
        return `
          <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 space-y-3">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-bold text-base text-pink-400">${m.model_name} 📍 ${m.district}</h3>
                <p class="text-zinc-300 mt-1">💇‍♀️ <strong>頭髮現狀：</strong> ${m.hair_status}</p>
                <p class="text-zinc-400 text-[11px] mt-0.5">📞 <strong>電話：</strong> ${m.whatsapp}</p>
              </div>
              <a href="${waLink}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition flex items-center gap-1 shrink-0">
                <i class="fa-brands fa-whatsapp"></i> 聯繫Model
              </a>
            </div>
            ${m.photo_base64 ? `<div class="mt-2"><span class="text-[10px] text-zinc-500 block mb-1">頭髮/素人相片預覽（點擊放大）：</span><img src="${m.photo_base64}" class="w-32 h-32 object-cover rounded-lg border border-zinc-700 cursor-pointer hover:border-pink-500 hover:scale-105 transition" onclick="zoomImage(this.src)" title="點擊全螢幕放大檢視"></div>` : ''}
            <div class="flex justify-end pt-2 border-t border-zinc-900">
              <button onclick="deleteModel(${m.id})" class="text-red-400 hover:text-red-300 text-[11px] underline">刪除此筆記錄</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteModel(id) {
      if (confirm('確定要刪除這筆模特兒記錄嗎？')) {
        await supabaseClient.from('hair_models').delete().eq('id', id);
        loadModelsData();
      }
    }

    // 🔍 燈箱圖片放大檢視邏輯
    function zoomImage(src) {
      document.getElementById('modalFullImage').src = src;
      document.getElementById('imageViewerModal').classList.remove('hidden');
    }
    function closeImageViewer() {
      document.getElementById('imageViewerModal').classList.add('hidden');
    }
  </script>
</body>
</html>
